<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Calibración y Lectura VH400</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        fieldset {
            margin-bottom: 15px;
            padding: 10px;
        }
        label {
            display: inline-block;
            width: 180px;
            margin-bottom: 8px;
        }
        input[type="number"] {
            width: 100px;
            padding: 4px;
        }
        button {
            padding: 8px 14px;
            margin-right: 10px;
            font-size: 16px;
        }
        #estado {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Calibración y Lectura Continua - Sonda VH400</h2>
    <form id="formVariables">
        <fieldset>
            <legend>Variables de calibración</legend>
            <label for="voltMin">Voltaje mínimo (V):</label>
            <input type="number" step="0.01" id="voltMin" name="voltMin" value="0.23" required /><br/>
            
            <label for="voltMax">Voltaje máximo (V):</label>
            <input type="number" step="0.01" id="voltMax" name="voltMax" value="1.85" required /><br/>
            
            <label for="tempMin">Temperatura mínima (°C):</label>
            <input type="number" step="0.1" id="tempMin" name="tempMin" value="0" required /><br/>
            
            <label for="tempMax">Temperatura máxima (°C):</label>
            <input type="number" step="0.1" id="tempMax" name="tempMax" value="50" required /><br/>
            
            <label for="factorComp">Factor compensación temperatura:</label>
            <input type="number" step="0.001" id="factorComp" name="factorComp" value="0.0054" required /><br/>
            
            <label for="offsetComp">Offset compensación:</label>
            <input type="number" step="0.001" id="offsetComp" name="offsetComp" value="0" required /><br/>
        </fieldset>
        <fieldset>
            <legend>Sensores seleccionados</legend>
            <label><input type="checkbox" name="sensores" value="A" checked disabled /> VH400 (Humedad suelo)</label><br/>
            <label><input type="checkbox" name="sensores" value="E" checked /> DS18B20 (Temperatura suelo)</label><br/>
        </fieldset>
        <!-- Botón Guardar Configuración -->
        <legend>Frecuencia de lectura</legend>
        <label for="frecuencia">Frecuencia (ms):</label>
        <input type="number" id="frecuencia" name="frecuencia" value="1" step="1" min="1" required /><br/>
        <button type="button" id="btnGuardar">Guardar Configuración</button>
        <button type="button" id="btnIniciar">Iniciar Lectura Continua</button>
        <button type="button" id="btnDetener" disabled>Detener Lectura Continua</button>
    </form>
    
    <div id="estado"></div>
    <canvas id="grafico" width="300" height="150"></canvas>

    <script>
        let lecturaActiva = false;
        let eventSource = null;
        const estadoEl = document.getElementById('estado');
        const btnIniciar = document.getElementById('btnIniciar');
        const btnDetener = document.getElementById('btnDetener');
        const ctx = document.getElementById('grafico').getContext('2d');

        // Inicialización gráfico
        const datosGrafico = {
            labels: [],
            datasets: [
                {
                    label: 'Humedad sin compensar (%)',
                    borderColor: 'blue',
                    backgroundColor: 'rgba(0,0,255,0.1)',
                    data: [],
                    fill: true,
                },
                {
                    label: 'Humedad compensada (%)',
                    borderColor: 'green',
                    backgroundColor: 'rgba(0,255,0,0.1)',
                    data: [],
                    fill: true,
                },
                {
                    label: 'Temperatura (°C)',
                    borderColor: 'red',
                    backgroundColor: 'rgba(255,0,0,0.1)',
                    data: [],
                    fill: false,
                    yAxisID: 'yTemp',
                }
            ]
        };

        const configGrafico = {
            type: 'line',
            data: datosGrafico,
            options: {
                animation: false,
                responsive: true,
                scales: {
                    y: {
                        type: 'linear',
                        position: 'left',
                        min: 0,
                        max: 100,
                        title: { display: true, text: 'Humedad (%)' }
                    },
                    yTemp: {
                        type: 'linear',
                        position: 'right',
                        min: -10,
                        max: 60,
                        title: { display: true, text: 'Temperatura (°C)' },
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        };

        const chart = new Chart(ctx, configGrafico);

        // Función para validar formulario
        function validarFormulario() {
            return document.getElementById('formVariables').checkValidity();
        }

        // Función para convertir voltaje a humedad sin compensar (%)
        // (Voltaje mínimo 0.23V = 0% / Voltaje máximo 1.85V = 100%)
        function voltajeAHumedad(v, voltMin, voltMax) {
            let hum = ((v - voltMin) / (voltMax - voltMin)) * 100;
            if (hum < 0) hum = 0;
            if (hum > 100) hum = 100;
            return hum;
        }

        // Función para compensar humedad con temperatura (fórmula simple)
        // humComp = humSinComp + factorComp * (temp - tempMin) + offsetComp
        function compensarHumedad(hum, temp, tempMin, factorComp, offsetComp) {
            return hum + factorComp * (temp - tempMin) + offsetComp;
        }

        // Iniciar lectura continua
        btnIniciar.onclick = () => {
            if (!validarFormulario()) {
                alert("Por favor completa todos los campos correctamente.");
                return;
            }
            if (lecturaActiva) {
                alert("Ya hay una lectura continua activa.");
                return;
            }

            // Leer variables desde formulario
            /*const voltMin = parseFloat(document.getElementById('voltMin').value);
            const voltMax = parseFloat(document.getElementById('voltMax').value);
            const tempMin = parseFloat(document.getElementById('tempMin').value);
            const tempMax = parseFloat(document.getElementById('tempMax').value);
            const factorComp = parseFloat(document.getElementById('factorComp').value);
            const offsetComp = parseFloat(document.getElementById('offsetComp').value);
            */
            // Limpiar datos anteriores del gráfico
            datosGrafico.labels.length = 0;
            datosGrafico.datasets.forEach(ds => ds.data.length = 0);
            chart.update();

            // Abrir conexión SSE al backend, enviando los sensores que quieres leer en modo LC
            // Por ahora sin enviar variables, solo sensores seleccionados (solo DS18B20 y VH400)
            const sensores = [];
            document.querySelectorAll('input[name="sensores"]:checked').forEach(chk => {
                sensores.push(chk.value);
            });
            const frecuencia = document.getElementById('frecuencia').valueAsNumber;

            //const frecuencia = parseInt(document.getElementById('frecuencia').value);
            //const url = `/leer_sensores?modo=LC&comando=${sensores.join(',')}`;
            const url = `/leer_sensores?modo=LC&comando=${sensores.join('')}&frecuencia=${frecuencia}`;
            eventSource = new EventSource(url);

            lecturaActiva = true;
            btnIniciar.disabled = true;
            btnDetener.disabled = false;
            estadoEl.textContent = "Lectura continua iniciada...";

            eventSource.onmessage = function(event) {
                try {
                    
                    // Mostrar contenido original recibido como string
                    //alert("Datos recibidos:\n" + event.data);
                    
                    const datos = JSON.parse(event.data);
                    console.log("Datos recibidos:", datos);

                   /* const voltMin = parseFloat(document.getElementById('voltMin').value);
                    const voltMax = parseFloat(document.getElementById('voltMax').value);
                    const tempMin = parseFloat(document.getElementById('tempMin').value);
                    const factorComp = parseFloat(document.getElementById('factorComp').value);
                    const offsetComp = parseFloat(document.getElementById('offsetComp').value);
                    */
                    const voltMin = document.getElementById('voltMin').valueAsNumber;
                    const voltMax = document.getElementById('voltMax').valueAsNumber;
                    const tempMin = document.getElementById('tempMin').valueAsNumber;
                    const factorComp = document.getElementById('factorComp').valueAsNumber;
                    const offsetComp = document.getElementById('offsetComp').valueAsNumber;


                    // Asumamos que recibes JSON con voltaje y temperatura:
                    // { "vh400_volt": 1.2, "ds18b20_temp": 23.5 }

                    const voltaje = datos.volt_analog;
                    const temperatura = datos.temp_ds18;

                    if (voltaje === undefined || temperatura === undefined) {
                        estadoEl.textContent = "Error: datos incompletos recibidos.";
                        return;
                    }

                    // Calcular humedad sin compensar y compensada
                    const humSinComp = voltajeAHumedad(voltaje, voltMin, voltMax);
                    const humComp = compensarHumedad(humSinComp, temperatura, tempMin, factorComp, offsetComp);

                    // Actualizar gráfico
                    const tiempoActual = new Date().toLocaleTimeString();
                    datosGrafico.labels.push(tiempoActual);
                    datosGrafico.datasets[0].data.push(humSinComp);
                    datosGrafico.datasets[1].data.push(humComp);
                    datosGrafico.datasets[2].data.push(temperatura);

                    // Limitar a 30 puntos para no sobrecargar gráfico
                    if (datosGrafico.labels.length > 30) {
                        datosGrafico.labels.shift();
                        datosGrafico.datasets.forEach(ds => ds.data.shift());
                    }
                    chart.update();

                    estadoEl.textContent = `Voltaje: ${voltaje.toFixed(3)} V | Temperatura: ${temperatura.toFixed(2)} °C`;
                } catch (e) {
                    estadoEl.textContent = "Error al procesar datos: " + e.message;
                }
            };

            eventSource.onerror = function() {
                estadoEl.textContent = "Error de conexión o lectura terminada.";
                detenerLectura();
            };
        };

        // Detener lectura continua
        btnDetener.onclick = () => {
            if (!lecturaActiva) return;
            detenerLectura();
        };

        async function detenerLectura() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }

            try {
                await fetch('/leer_sensores?modo=STOP');
            } catch (e) {
                console.error('Error al enviar comando STOP:', e);
            }

            lecturaActiva = false;
            btnIniciar.disabled = false;
            btnDetener.disabled = true;
            estadoEl.textContent = "Lectura continua detenida.";
        }

    </script>
    <script>
        const btnGuardar = document.getElementById('btnGuardar');

        btnGuardar.onclick = async () => {
            if (!validarFormulario()) {
                alert("Por favor completa todos los campos correctamente.");
                return;
            }
            // Leer variables del formulario
           /* const data = {
                voltMin: parseFloat(document.getElementById('voltMin').value),
                voltMax: parseFloat(document.getElementById('voltMax').value),
                tempMin: parseFloat(document.getElementById('tempMin').value),
                tempMax: parseFloat(document.getElementById('tempMax').value),
                factorComp: parseFloat(document.getElementById('factorComp').value),
                offsetComp: parseFloat(document.getElementById('offsetComp').value),
            };
            */

            const data = {
                voltMin: document.getElementById('voltMin').valueAsNumber,
                voltMax: document.getElementById('voltMax').valueAsNumber,
                tempMin: document.getElementById('tempMin').valueAsNumber,
                tempMax: document.getElementById('tempMax').valueAsNumber,
                factorComp: document.getElementById('factorComp').valueAsNumber,
                offsetComp: document.getElementById('offsetComp').valueAsNumber,
            };


            try {
                const resp = await fetch('/configurar_vh400', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await resp.json();

                if (resp.ok) {
                    alert(result.status || 'Configuración guardada correctamente');
                } else {
                    alert(result.error || 'Error al guardar configuración');
                }
            } catch (e) {
                alert('Error de comunicación con el servidor');
            }
        };

    </script>
    <script>
    window.onload = () => {
        const getOrDefault = (id, defaultVal) => {
            const input = document.getElementById(id);
            const stored = localStorage.getItem(id);
            input.value = stored !== null ? stored : defaultVal;
        };
        getOrDefault('voltMin', 0.0);
        getOrDefault('voltMax', 3.0);
        getOrDefault('tempMin', 0);
        getOrDefault('tempMax', 50);
        getOrDefault('factorComp', 0.0054);
        getOrDefault('offsetComp', 0);
        getOrDefault('frecuencia', 1);
    };
    </script>

    <br><br>
    <a href="/index" style="text-decoration:none;">
        <button>Volver a Lectura de Sensores</button>
    </a>

</body>
</html>
