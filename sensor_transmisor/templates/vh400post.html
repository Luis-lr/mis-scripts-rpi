<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Calibración VH400</title>
    <style>
      label { display: block; margin-top: 8px; }
      input { width: 100px; }
      #mensaje { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
  <h1>Configuración de Calibración VH400</h1>

  <form id="formCalibracion">
    <label>
      Factor de escala:
      <input type="number" step="0.01" name="factor_escala" value="1.0" required />
    </label>
    <label>
      Offset:
      <input type="number" step="0.01" name="offset" value="0.0" required />
    </label>
    <label>
      Límite mínimo (%):
      <input type="number" step="0.1" name="limite_min" value="0" required />
    </label>
    <label>
      Límite máximo (%):
      <input type="number" step="0.1" name="limite_max" value="100" required />
    </label>
    <button type="submit">Guardar configuración</button>
  </form>

  <div id="mensaje"></div>

  <script>
    const form = document.getElementById('formCalibracion');
    const mensajeDiv = document.getElementById('mensaje');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const formData = new FormData(form);
      const data = {};
      formData.forEach((value, key) => {
        data[key] = value;
      });

      try {
        const resp = await fetch('/configurar_vh400', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });
        const result = await resp.json();

        if (resp.ok) {
          mensajeDiv.style.color = 'green';
          mensajeDiv.textContent = result.status || 'Configuración guardada correctamente';
        } else {
          mensajeDiv.style.color = 'red';
          mensajeDiv.textContent = result.error || 'Error al guardar configuración';
        }
      } catch (error) {
        mensajeDiv.style.color = 'red';
        mensajeDiv.textContent = 'Error de comunicación con el servidor';
      }
    });
  </script>
</body>
</html>
